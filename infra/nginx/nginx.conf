user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # OTP Rate Limiting: 5 requests per minute per IP, burst of 3, immediate response
    limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=5r/m;
    limit_req_status 429;

    # Upstream Microservice Definitions
    upstream auth_backend {
        server auth-service:3001;
    }

    upstream booking_backend {
        server booking-service:3002;
    }

    upstream store_backend {
        server store-service:3006;
    }

    upstream admin_backend {
        server admin-api:3007;
    }

    upstream inventory_backend {
        server inventory-service:3008;
    }

    upstream notify_backend {
        server notify-service:3005;
    }

    upstream admin_frontend {
        server admin-panel:80;
    }

    upstream web_frontend {
        server web:80;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 10M;

        # -----------------------------------------------------------------
        # Health Check
        # -----------------------------------------------------------------
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","gateway":"flashfix-nginx"}';
        }

        # -----------------------------------------------------------------
        # Rate-Limited OTP Endpoints
        # -----------------------------------------------------------------
        # 1. Auth Service Send OTP
        location = /api/auth/send-otp {
            limit_req zone=otp_limit burst=3 nodelay;
            proxy_pass http://auth_backend/auth/send-otp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Booking Service Send Pickup OTP
        location ~ ^/api/bookings/([^/]+)/send-pickup-otp$ {
            limit_req zone=otp_limit burst=3 nodelay;
            rewrite ^/api/bookings/(.*)$ /bookings/$1 break;
            proxy_pass http://booking_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Booking Service Send Custody OTP
        location ~ ^/api/bookings/([^/]+)/send-custody-otp$ {
            limit_req zone=otp_limit burst=3 nodelay;
            rewrite ^/api/bookings/(.*)$ /bookings/$1 break;
            proxy_pass http://booking_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------------
        # Microservice API Reverse Proxies
        # -----------------------------------------------------------------
        # Auth Service
        location /api/auth {
            rewrite ^/api/auth/?(.*)$ /auth/$1 break;
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Booking Service
        location /api/bookings {
            rewrite ^/api/bookings/?(.*)$ /bookings/$1 break;
            proxy_pass http://booking_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Store Service
        location /api/stores {
            rewrite ^/api/stores/?(.*)$ /stores/$1 break;
            proxy_pass http://store_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin API
        location /api/admin {
            rewrite ^/api/admin/?(.*)$ /admin/$1 break;
            proxy_pass http://admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Inventory Service
        location /api/inventory {
            rewrite ^/api/inventory/?(.*)$ /inventory/$1 break;
            proxy_pass http://inventory_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notify Service (Internal & Dev Support)
        location /api/notify {
            rewrite ^/api/notify/?(.*)$ /notify/$1 break;
            proxy_pass http://notify_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------------
        # Frontend Applications
        # -----------------------------------------------------------------
        # Admin Panel Dashboard SPA
        location /admin {
            rewrite ^/admin/?(.*)$ /$1 break;
            proxy_pass http://admin_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Consumer Web Application SPA
        location / {
            proxy_pass http://web_frontend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
