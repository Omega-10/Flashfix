version: "3.9"

services:
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://server:3001

  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001

# Future additions:
# - postgres: for real store/order DB
# - redis: for caching nearby stores
# - nginx: reverse proxy / SSL termination
